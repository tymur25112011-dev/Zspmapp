name: Build official ZSPM PWA icons

on:
  push:
    paths:
      - ".github/workflows/build-pwa-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Render the exact in-app crest treatment into PNG icons
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from base64 import b64encode
          from pathlib import Path
          from urllib.request import Request, urlopen
          from playwright.sync_api import sync_playwright

          source_url = "https://www.bip.krakow.pl/zalaczniki/dokumenty/n/337741"
          request = Request(source_url, headers={
              "User-Agent": "Mozilla/5.0 (compatible; ZSPMCommunityIconBuilder/1.0)",
              "Referer": "https://www.bip.krakow.pl/"
          })
          with urlopen(request, timeout=30) as response:
              raw = response.read()
          data_uri = "data:image/png;base64," + b64encode(raw).decode("ascii")

          # Render the same official source image with the exact CSS filter,
          # border, background and glow used by the approved Witaj w ZSPM mark.
          html = f"""<!doctype html><html><head><meta charset="utf-8"><style>
          * {{ box-sizing:border-box }}
          html,body {{ margin:0;width:512px;height:512px;overflow:hidden;background:#050A13 }}
          img {{
            display:block;width:512px;height:512px;object-fit:contain;
            padding:6px;border:1px solid rgba(76,205,255,.62);border-radius:22px;
            background:linear-gradient(145deg,rgba(11,55,83,.94),rgba(17,35,65,.96));
            mix-blend-mode:screen;
            filter:invert(1) sepia(1) saturate(4.2) hue-rotate(164deg) brightness(1.12)
              drop-shadow(0 0 11px rgba(65,205,255,.5));
            box-shadow:0 0 20px rgba(28,174,255,.24),0 8px 26px rgba(0,0,0,.22);
          }}
          </style></head><body><img src="{data_uri}"></body></html>"""

          Path("public").mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width":512,"height":512}, device_scale_factor=1)
              page.set_content(html, wait_until="load")
              page.screenshot(path="public/zspm-community-icon-512.png", full_page=True)
              browser.close()

          from PIL import Image
          icon = Image.open("public/zspm-community-icon-512.png").convert("RGB")
          if icon.size != (512,512):
              raise RuntimeError(f"Unexpected icon dimensions: {icon.size}")
          icon.resize((192,192),Image.Resampling.LANCZOS).save(
              "public/zspm-community-icon-192.png", optimize=True
          )
          print("Created exact-style 512px and 192px PNG icons from official BIP crest")
          PY

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/zspm-community-icon-192.png public/zspm-community-icon-512.png
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
            exit 0
          fi
          git commit -m "Add self-contained PNG icons using official ZSPM crest"
          git push
