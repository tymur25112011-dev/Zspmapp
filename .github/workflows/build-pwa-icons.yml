name: Build official ZSPM PWA icons

on:
  push:
    paths:
      - ".github/workflows/build-pwa-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate self-contained PNG icons from the official crest
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from io import BytesIO
          from urllib.request import Request, urlopen
          from PIL import Image, ImageDraw, ImageFilter, ImageOps
          import os

          source_url = "https://www.bip.krakow.pl/zalaczniki/dokumenty/n/337741"
          request = Request(source_url, headers={
              "User-Agent": "Mozilla/5.0 (compatible; ZSPMCommunityIconBuilder/1.0)",
              "Referer": "https://www.bip.krakow.pl/"
          })
          with urlopen(request, timeout=30) as response:
              raw = response.read()
          source = Image.open(BytesIO(raw)).convert("RGBA")
          print("Official crest source:", source.size)

          # The BIP file is a white crest on a dark square. Convert only that
          # dark canvas to transparency while preserving the original crest silhouette.
          alpha = source.getchannel("A")
          if alpha.getextrema() == (255, 255):
              gray = ImageOps.grayscale(source)
              alpha = gray.point(lambda p: max(0, min(255, int((p - 38) * 255 / 190))))
          else:
              gray = ImageOps.grayscale(source)
              luminance_mask = gray.point(lambda p: max(0, min(255, int((p - 24) * 255 / 205))))
              from PIL import ImageChops
              alpha = ImageChops.multiply(alpha, luminance_mask)

          bbox = alpha.point(lambda p: 255 if p > 12 else 0).getbbox()
          if not bbox:
              raise RuntimeError("Could not isolate the white crest from the source image")
          alpha = alpha.crop(bbox)

          # Compose a full-bleed, Android-friendly square with the same navy/blue
          # glass treatment used by the app header. The crest geometry is unchanged.
          size = 512
          base = Image.new("RGBA", (size, size), (6, 15, 29, 255))
          pixels = base.load()
          for y in range(size):
              t = y / (size - 1)
              for x in range(size):
                  glow = max(0.0, 1.0 - (((x - 256) ** 2 + (y - 224) ** 2) ** 0.5) / 360)
                  pixels[x, y] = (
                      int(6 + 8 * (1 - t) + 5 * glow),
                      int(15 + 18 * (1 - t) + 28 * glow),
                      int(29 + 26 * (1 - t) + 43 * glow),
                      255
                  )

          max_crest = 350
          scale = min(max_crest / alpha.width, max_crest / alpha.height)
          crest_size = (max(1, round(alpha.width * scale)), max(1, round(alpha.height * scale)))
          alpha = alpha.resize(crest_size, Image.Resampling.LANCZOS)

          # Subtle cyan glow behind the original white silhouette.
          glow_mask = Image.new("L", (size, size), 0)
          gx = (size - crest_size[0]) // 2
          gy = (size - crest_size[1]) // 2 - 2
          glow_mask.paste(alpha, (gx, gy))
          glow_mask = glow_mask.filter(ImageFilter.GaussianBlur(20))
          glow_layer = Image.new("RGBA", (size, size), (36, 151, 255, 0))
          glow_layer.putalpha(glow_mask.point(lambda p: int(p * 0.34)))
          base = Image.alpha_composite(base, glow_layer)

          crest_layer = Image.new("RGBA", crest_size, (151, 211, 255, 0))
          crest_layer.putalpha(alpha)
          base.alpha_composite(crest_layer, (gx, gy))

          draw = ImageDraw.Draw(base)
          draw.rounded_rectangle((22, 22, 490, 490), radius=104,
                                 outline=(63, 170, 255, 220), width=6)
          draw.rounded_rectangle((38, 38, 474, 474), radius=90,
                                 outline=(156, 207, 255, 55), width=2)

          os.makedirs("public", exist_ok=True)
          base.convert("RGB").save("public/zspm-community-icon-512.png", optimize=True)
          base.resize((192, 192), Image.Resampling.LANCZOS).convert("RGB").save(
              "public/zspm-community-icon-192.png", optimize=True
          )
          PY

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/zspm-community-icon-192.png public/zspm-community-icon-512.png
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
            exit 0
          fi
          git commit -m "Add self-contained PNG icons using official ZSPM crest"
          git push
